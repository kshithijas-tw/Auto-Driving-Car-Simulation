[project]
name = "auto-driving-car-simulation"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = [
    "--cov=src",
    "--cov-report=term-missing",
]

[tool.coverage.run]
branch = true
source = ["src"]
omit = [
    "tests/*",
]

[tool.coverage.report]
skip_covered = true
show_missing = true
